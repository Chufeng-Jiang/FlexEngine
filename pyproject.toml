[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flexengine-runtime"
version = "0.1.0"
description = "A modular, single-GPU Qwen2.5 inference engine for systems experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "transformers>=4.46,<6",
  "accelerate>=0.26",
  "safetensors>=0.4",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2",
  "prometheus-client>=0.20",
]

[project.scripts]
flexengine = "flexengine.serving.cli:main"
flexengine-serve = "flexengine.serving.cli.server:main"
flexengine-check-env = "flexengine.operations.tooling.environment:check_main"
flexengine-export-env = "flexengine.operations.tooling.environment:export_main"
flexengine-benchmark = "flexengine.research.benchmark.runner:main"
flexengine-run-proposal = "flexengine.research.experiments.runner:main"
flexengine-run-warm-benchmarks = "flexengine.research.experiments.runner:warm_main"
flexengine-analyze-proposal = "flexengine.research.analysis.results:main"
flexengine-analyze-warm-benchmarks = "flexengine.research.analysis.results:warm_main"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.7", "numpy>=1.24", "matplotlib>=3.7", "requests>=2.31"]
triton = ["triton>=3.0"]
flashinfer = ["flashinfer-python>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["flexengine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["gpu: requires a CUDA GPU and possibly Hugging Face model weights"]

[tool.ruff]
line-length = 115
extend-exclude = [".venv-vllm"]
