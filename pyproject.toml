[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flexengine-runtime"
version = "0.1.0"
description = "A modular, single-GPU Qwen2.5 inference engine for systems experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "transformers>=4.46,<6",
  "accelerate>=0.26",
  "safetensors>=0.4",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.7", "numpy>=1.24", "matplotlib>=3.7", "requests>=2.31"]
triton = ["triton>=3.0"]

[tool.setuptools.packages.find]
include = ["flexengine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a CUDA GPU and possibly Hugging Face model weights"]

[tool.ruff]
line-length = 115
extend-exclude = [".venv-vllm"]
