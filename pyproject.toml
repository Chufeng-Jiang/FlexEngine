[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flexengine-runtime"
version = "0.1.0"
description = "A modular, single-GPU Qwen2.5 inference engine for systems experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "transformers>=4.46,<6",
  "accelerate>=0.26",
  "safetensors>=0.4",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2",
  "prometheus-client>=0.20",
]

[project.scripts]
flexengine = "flexengine.cli:main"
flexengine-serve = "scripts.run_server:main"
flexengine-smoke = "scripts.smoke_client:main"
flexengine-check-env = "scripts.check_environment:main"
flexengine-export-env = "scripts.export_environment:main"
flexengine-benchmark = "benchmarks.replay:main"
flexengine-run-proposal = "experiments.run_proposal:main"
flexengine-run-upgrade = "experiments.run_upgrade:main"
flexengine-analyze-proposal = "experiments.analyze_proposal:main"
flexengine-analyze-upgrade = "experiments.analyze_upgrade:main"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.7", "numpy>=1.24", "matplotlib>=3.7", "requests>=2.31"]
triton = ["triton>=3.0"]
flashinfer = ["flashinfer-python>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["flexengine*", "benchmarks*", "experiments*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["gpu: requires a CUDA GPU and possibly Hugging Face model weights"]

[tool.ruff]
line-length = 115
extend-exclude = [".venv-vllm"]
